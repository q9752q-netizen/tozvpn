<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TozVPN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #041426;
      --text: #e7f0f8;
      --muted: #8ea6bf;
      --line: rgba(154, 196, 232, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      background: #041426;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 40px 28px 32px;
      border: 0;
      border-radius: 28px;
      background: rgba(8, 28, 52, 0.72);
    }

    .mark {
      margin: 0;
      color: #7eb6e6;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 560;
      line-height: 1.15;
    }

    p {
      margin: 0;
      max-width: 28ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    button {
      margin-top: auto;
      border: 0;
      border-radius: 16px;
      padding: 16px 18px;
      background: #123a5c;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      background: #2f86c8;
      color: #ffffff;
      box-shadow: 0 0 28px rgba(150, 214, 255, 0.85);
    }

    button:active {
      background: #164e7a;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <main>
    <p class="mark">TozVPN</p>
    <h1 id="greeting">Привет!</h1>
    <p>Быстрый и стабильный доступ.</p>
    <button id="close-btn" type="button">Закрыть</button>
  </main>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const name = tg.initDataUnsafe?.user?.first_name || "друг";
    document.getElementById("greeting").textContent = `Привет, ${name}!`;

    document.getElementById("close-btn").addEventListener("click", () => {
      tg.close();
    });

    const canvas = document.getElementById("trail");
    const ctx = canvas.getContext("2d");
    const points = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    window.addEventListener("pointermove", (event) => {
      points.push({ x: event.clientX, y: event.clientY, life: 1 });
      if (points.length > 48) points.shift();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 1; i < points.length; i++) {
        const prev = points[i - 1];
        const point = points[i];
        point.life *= 0.975;

        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(point.x, point.y);
        ctx.strokeStyle = `rgba(150, 205, 245, ${point.life * 0.28})`;
        ctx.lineWidth = 6 * point.life;
        ctx.lineCap = "round";
        ctx.shadowColor = "rgba(120, 190, 240, 0.85)";
        ctx.shadowBlur = 16;
        ctx.stroke();
      }

      while (points.length && points[0].life < 0.04) points.shift();
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
